# PrusaSlicer / SuperSlicer print settings for the disc valve.
# Load on top of your own printer + filament profile, e.g.
#   prusa-slicer --load my_printer.ini --load slicer/petg_0.2mm.ini ...
# Material: PETG (humid bathroom/kitchen air, ~70 C softening).
# Use ASA if the valve sits near a cooker hood or in direct sun.

layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 30%
fill_pattern = gyroid
support_material = 0
brim_width = 0
skirts = 1
# keep the visible (bed-side) faces clean
elefant_foot_compensation = 0.2
ironing = 0
seam_position = rear
external_perimeter_speed = 25
perimeter_speed = 40
infill_speed = 80
first_layer_temperature = 235
temperature = 240
first_layer_bed_temperature = 80
bed_temperature = 80
cooling = 1
min_fan_speed = 30
max_fan_speed = 60
